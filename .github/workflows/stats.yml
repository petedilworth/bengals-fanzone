name: Pull stats

# Pulls every nflverse source and rebuilds data/stats/*.json. Runs four times a week so a
# source that lags the game (Pro Football Reference, days behind) is picked up on a later run.
# Each run records which week each source covers; the site shows "through Week N" per source.

on:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/stats.yml"]
  workflow_dispatch:
  schedule:
    # Mon, Wed, Thu, Sat at 11:23 UTC (7:23 am ET). Sunday-night data is in by Monday morning.
    - cron: "23 11 * * 1,3,4,6"
    # Wed 22:17 UTC (6:17 pm ET): after the 1:17 pm round-up, to copy its media topics file.
    - cron: "17 22 * * 3"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Keep pulled files between runs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-raw-${{ github.run_id }}
          restore-keys: nflverse-raw-
      - name: Pull and build
        # No --force: unchanged files answer 304 and cost nothing; finished seasons are never re-pulled.
        run: python3 pipeline/build_stats.py
      - name: Copy media topics from the private research repo
        # Needs the RESEARCH_TOKEN secret (fine-grained token, Contents: read on bengals-research; created Oct 14, 2026, expires Feb 14, 2027).
        # Without it this step says so and the rest of the run carries on.
        env:
          RESEARCH_TOKEN: ${{ secrets.RESEARCH_TOKEN }}
        run: |
          if [ -z "$RESEARCH_TOKEN" ]; then echo "RESEARCH_TOKEN not set; skipping media sync"; exit 0; fi
          git clone --quiet --depth 1 "https://x-access-token:${RESEARCH_TOKEN}@github.com/petedilworth/bengals-research.git" /tmp/research
          python3 pipeline/sync_media.py /tmp/research
          rm -rf /tmp/research
      - name: Commit changed data
        run: |
          git config user.name "stats bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/stats data/media data/season-*.json
          # Timestamps and byte counts change every run; only commit when a number, a week or a result changed.
          if git diff --cached --quiet -I '"(generated|checked|downloaded|downloaded_bytes|cached|note)": '; then echo "Nothing but run bookkeeping changed"; exit 0; fi
          git commit -m "Stats: $(date -u +%Y-%m-%d) $(python3 -c "import json;s=json.load(open('data/stats/sources.json'))['status'];print(' '.join(f\"{k}=w{v['through_week']}\" for k,v in s.items()))")"
          git push
